services:
  castara-api:
    container_name: castara-api
    build:
      context: .
      dockerfile: src/Castara.Web.Api/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
    restart: unless-stopped
